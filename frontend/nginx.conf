# Bot detection: set $is_bot = 1 for social/search crawlers
map $http_user_agent $is_bot {
    default                           0;
    ~*(facebookexternalhit|Facebot)   1;
    ~*(Twitterbot)                    1;
    ~*(LinkedInBot)                   1;
    ~*(WhatsApp)                      1;
    ~*(TelegramBot)                   1;
    ~*(Slackbot)                      1;
    ~*(Discordbot)                    1;
    ~*(Zalobot|ZaloPC)                1;
    ~*(Googlebot|bingbot|yandex)      1;
    ~*(Applebot)                      1;
    ~*(PinterestBot)                  1;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    # Handle React Router (with bot prerender)
    location / {
        # If bot → proxy to backend prerender for proper OG tags
        if ($is_bot) {
            rewrite ^(.*)$ /_prerender$1 last;
        }
        try_files $uri $uri/ /index.html;
    }

    # Internal prerender proxy to backend
    location /_prerender/ {
        internal;
        proxy_pass http://backend:8000/_prerender/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets (Dành riêng cho Frontend React/Vue)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy sitemap to backend
    location = /sitemap.xml {
        proxy_pass http://backend:8000/api/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Serve static admin files directly from mounted volume (faster than proxy)
    # THÊM ^~ ĐỂ CHẶN BLOCK REGEX PHÍA TRÊN CƯỚP REQUEST
    location ^~ /static/ {
        alias /usr/share/nginx/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy admin panel to backend
    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy CKEditor upload/browse endpoints to backend
    location /ckeditor5/ {
        proxy_pass http://backend:8000/ckeditor5/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve media files directly from mounted volume
    # THÊM ^~ VÀO ĐÂY LUN ĐỂ ẢNH UPLOAD KHÔNG BỊ LỖI
    location ^~ /media/ {
        alias /usr/share/nginx/media/;
        expires 7d;
    }
}
