name: CI/CD Pipeline

on:
  push:
    branches: [ main, feature/*, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: thptluongthucky-backend
  FRONTEND_IMAGE: thptluongthucky-frontend

jobs:
  # ========================
  # BACKEND CI - Python/Django
  # ========================
  backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Django check
      env:
        DB_NAME: test_db
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432
        SECRET_KEY: test-secret-key
        DEBUG: "False"
        ALLOWED_HOSTS: localhost,127.0.0.1
      run: |
        cd backend
        python manage.py check --deploy

    - name: Run Django migrations
      env:
        DB_NAME: test_db
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432
        SECRET_KEY: test-secret-key
        DEBUG: "True"
        ALLOWED_HOSTS: localhost,127.0.0.1
      run: |
        cd backend
        python manage.py migrate --no-input

    - name: Run Django tests
      env:
        DB_NAME: test_db
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432
        SECRET_KEY: test-secret-key
        DEBUG: "True"
        ALLOWED_HOSTS: localhost,127.0.0.1
      run: |
        cd backend
        python manage.py test --verbosity=2 --no-input

    - name: Collect static files
      env:
        SECRET_KEY: test-secret-key
      run: |
        cd backend
        python manage.py collectstatic --noinput --dry-run

    - name: Build backend Docker image
      run: |
        docker build -f backend/Dockerfile -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} backend/

  # ========================
  # FRONTEND CI - Node/Vite
  # ========================
  frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Run ESLint
      run: |
        cd frontend
        npm run lint --no-fix

    - name: Build frontend
      env:
        VITE_API_URL: http://localhost:8000/api
      run: |
        cd frontend
        npm run build

    - name: Verify build artifacts
      run: |
        if [ ! -d "frontend/dist" ]; then
          echo "Build failed: dist directory not found"
          exit 1
        fi
        echo "Build artifacts verified"
        ls -lah frontend/dist/

    - name: Build frontend Docker image
      run: |
        docker build -f frontend/Dockerfile -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} frontend/

  # ========================
  # DOCKER COMPOSE INTEGRATION TEST
  # ========================
  docker-compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create .env file for Docker Compose
      run: |
        cat > .env << EOF
        # Database
        POSTGRES_USER=postgres
        POSTGRES_PASSWORD=postgres
        POSTGRES_DB=thptluongthucky
        DB_HOST=db
        DB_PORT=5432
        DB_NAME=thptluongthucky
        DB_USER=postgres
        DB_PASSWORD=postgres
        
        # Django
        SECRET_KEY=ci-test-secret-key-do-not-use-in-production
        DEBUG=False
        ALLOWED_HOSTS=*
        
        # Media and Static
        MEDIA_ROOT=/app/media
        STATIC_ROOT=/app/staticfiles
        
        # API
        VITE_API_URL=http://localhost:8000/api
        EOF

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Pull base images
      run: |
        docker pull node:20-alpine || true
        docker pull python:3.12-slim || true
        docker pull postgres:15-alpine || true

    - name: Build with Docker Compose (with retry)
      run: |
        #!/bin/bash
        set -e
        max_attempts=3
        attempt=1
        
        while [ $attempt -le $max_attempts ]; do
          echo "Build attempt $attempt of $max_attempts..."
          if docker compose -f docker-compose.yml build; then
            echo "Build successful!"
            break
          else
            if [ $attempt -lt $max_attempts ]; then
              echo "Build failed, waiting 60 seconds before retry..."
              sleep 60
            fi
            attempt=$((attempt + 1))
          fi
        done
        
        if [ $attempt -gt $max_attempts ]; then
          echo "Build failed after $max_attempts attempts"
          exit 1
        fi

    - name: Start services with Docker Compose
      run: |
        docker compose -f docker-compose.yml up -d
        sleep 10

    - name: Check service health
      run: |
        echo "Checking Database..."
        docker compose exec -T db pg_isready -U postgres
        
        echo "Checking Backend..."
        docker compose exec -T backend python manage.py check
        
        echo "Checking all containers..."
        docker compose ps

    - name: Clean up
      if: always()
      run: |
        docker compose down


